# just-shield 공급망 검사 + SARIF 업로드 데모.
# 위반이 있으면 scan 스텝이 실패하지만(if: always) 결과는 항상 업로드되어
# PR의 해당 코드 줄 위에 경고 주석으로 표시된다.
name: supply-chain
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF 업로드에 필요
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: kihyun1998/just-shield@066f5f60ce9611e71b86043668a763f0e84fdab9 # v0.1.3
        with:
          format: sarif
          output-file: results.sarif
      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always() # 위반으로 scan이 실패해도 결과는 업로드
        with:
          sarif_file: results.sarif
